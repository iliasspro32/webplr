<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso confirmado - PLR Digital Bundle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- META PIXEL PLACEHOLDER
    Pega aqui el mismo codigo base de Meta Pixel que uses en index.html.
    Para Stripe, configura el redirect de exito como /success.html?paid=stripe.
  -->

  <style>
    :root {
      --bg: #050505;
      --panel: #111114;
      --gold: #fbbf24;
      --gold-2: #f59e0b;
      --text: #f8fafc;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.1);
      --success: #22c55e;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 25% 10%, rgba(251, 191, 36, 0.16), transparent 28%),
        linear-gradient(145deg, #050505 0%, #111006 44%, #050505 100%);
      line-height: 1.5;
    }

    .card {
      width: min(760px, 100%);
      border: 1px solid rgba(251, 191, 36, 0.32);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.035));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .bar {
      height: 5px;
      background: linear-gradient(90deg, var(--gold), #f97316, var(--gold));
    }

    .content {
      padding: clamp(24px, 5vw, 46px);
      text-align: center;
    }

    .status {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 2px solid var(--success);
      border-radius: 50%;
      color: #bbf7d0;
      font-size: 2rem;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.7rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 18px;
      max-width: 620px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .download {
      display: inline-flex;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      border-radius: var(--radius);
      padding: 16px 22px;
      color: #111111;
      background: linear-gradient(180deg, #fde68a, var(--gold) 54%, var(--gold-2));
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 16px 32px rgba(251, 191, 36, 0.23);
    }

    .download.disabled {
      pointer-events: none;
      opacity: 0.48;
      filter: grayscale(1);
    }

    .note {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 0.92rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      font-size: 0.88rem;
    }

    .links a {
      color: #d4d4d8;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="bar"></div>
    <div class="content">
      <div class="status">&#10003;</div>
      <h1>Pago confirmado.</h1>
      <p id="status-message">Estamos verificando el pago antes de mostrar el acceso.</p>
      <a class="download disabled" id="download-link" href="https://drive.google.com/YOUR_DOWNLOAD_LINK" rel="nofollow">Descargar mi bundle</a>
      <p class="note">Si tienes algun problema con el acceso, responde al email de confirmacion de pago o contacta con soporte.</p>
      <nav class="links" aria-label="Legal links">
        <a href="./privacy.html">Privacy</a>
        <a href="./terms.html">Terms</a>
        <a href="./refund.html">Refund</a>
        <a href="./delivery.html">Delivery</a>
        <a href="./contact.html">Contact</a>
      </nav>
    </div>
  </main>

  <script>
    /*
      CONFIGURACION DE ENTREGA
      Cambia downloadUrl por tu enlace real de Google Drive, Dropbox, Cloudflare R2, Gumroad, Payhip, etc.
    */
    let DELIVERY_CONFIG = {
      downloadUrl: "https://drive.google.com/YOUR_DOWNLOAD_LINK",
      price: 29,
      currency: "USD",
      supportEmail: "support@example.com",
      metaPixelId: ""
    };

    const downloadLink = document.getElementById("download-link");
    const statusMessage = document.getElementById("status-message");
    const params = new URLSearchParams(window.location.search);
    const paidSource = params.get("paid");
    const sessionId = params.get("session_id");

    async function loadDeliveryConfig() {
      try {
        const response = await fetch("/api/config", { cache: "no-store" });
        if (!response.ok) return;
        const remoteConfig = await response.json();
        DELIVERY_CONFIG = { ...DELIVERY_CONFIG, ...remoteConfig };
      } catch (error) {
        console.warn("Remote delivery config unavailable. Using file defaults.");
      }
    }

    function initMetaPixel() {
      if (!DELIVERY_CONFIG.metaPixelId || typeof window.fbq === "function") return;

      window.fbq = function () {
        window.fbq.callMethod ? window.fbq.callMethod.apply(window.fbq, arguments) : window.fbq.queue.push(arguments);
      };
      if (!window._fbq) window._fbq = window.fbq;
      window.fbq.push = window.fbq;
      window.fbq.loaded = true;
      window.fbq.version = "2.0";
      window.fbq.queue = [];

      const script = document.createElement("script");
      script.async = true;
      script.src = "https://connect.facebook.net/en_US/fbevents.js";
      document.head.appendChild(script);

      window.fbq("init", DELIVERY_CONFIG.metaPixelId);
      window.fbq("track", "PageView");
    }

    function unlockDownload() {
      downloadLink.href = DELIVERY_CONFIG.downloadUrl;
      downloadLink.classList.remove("disabled");
      statusMessage.textContent = "Gracias por tu compra. Tu acceso al PLR Digital Bundle esta listo. Pulsa el boton para descargar o abrir el area de entrega.";
    }

    function trackStripePurchase() {
      if (typeof window.fbq !== "function") return;
      window.fbq("track", "Purchase", {
        value: DELIVERY_CONFIG.price,
        currency: DELIVERY_CONFIG.currency
      });
    }

    async function verifyStripeSession() {
      if (!sessionId) {
        statusMessage.textContent = "No se encontro una sesion de Stripe valida. Si ya pagaste, contacta con soporte.";
        return;
      }

      try {
        const response = await fetch(`/session-status?session_id=${encodeURIComponent(sessionId)}`);
        const data = await response.json();

        if (response.ok && data.status === "complete" && data.paymentStatus === "paid") {
          unlockDownload();
          trackStripePurchase();
          return;
        }

        statusMessage.textContent = "El pago todavia no aparece como completado. Espera unos segundos y actualiza la pagina.";
      } catch (error) {
        statusMessage.textContent = "No pudimos verificar el pago automaticamente. Contacta con soporte si el cargo fue realizado.";
      }
    }

    async function bootstrapDelivery() {
      await loadDeliveryConfig();
      initMetaPixel();

      if (paidSource === "stripe") {
        verifyStripeSession();
      } else if (paidSource === "paypal") {
        unlockDownload();
      } else {
        statusMessage.textContent = "Esta pagina se desbloquea despues de completar el pago.";
      }
    }

    bootstrapDelivery();
  </script>
</body>
</html>
